packages:
  - apps/*
  - apps/playgrounds/*/*
  - packages/*
  - packages/design-system/*
  - packages/schema-system/*
  - packages/schema-system/frameworks/*
  - packages/block-system/*
  - packages/block-system/frameworks/*
  - packages/backend-system/*
  - packages/graph-system/*
  - packages/graph-system/frameworks/*
  - packages/templates/*
  - packages/editor
  # Feature modules — the developer rung above blocks (see notes/we/August-2026/feature-modules.md)
  - packages/module-system/*
  # The globe module is a family: module + protocol + layers + widget
  - packages/module-system/globe/*

onlyBuiltDependencies:
  - electron

overrides:
  '@coasys/ad4m': 'link:../ad4m-sfu/core'
  '@coasys/ad4m-connect': '0.13.0-test-interpretation-2'
  prettier: '3.9.6'
  '@xmldom/xmldom': '>=0.9.12'
  app-builder-lib: '>=26.15.0'
  'brace-expansion@<1.1.18': '>=1.1.18'
  'brace-expansion@>=4.0.0 <5.0.9': '>=5.0.9'
  'esbuild@>=0.27.3 <0.28.1': '>=0.28.1'
  builder-util-runtime: '>=9.7.0'
  fast-uri: '>=3.1.6'
  qs: '>=6.16.0'
  tar: '>=7.5.21'
